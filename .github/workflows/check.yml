name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      published_version:
        description: Verify this matching npm version before rendering release presentation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Qualify package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Check essential package guarantees
        run: pnpm build && pnpm test:unit --tagsFilter='!full' && pnpm test:integration --tagsFilter='!full' && pnpm typecheck && pnpm lint && pnpm format:check
      - run: pnpm release:pack
      - run: pnpm exec node scripts/release/release.ts qualify
      - uses: actions/upload-artifact@v7
        with:
          name: qualified-package
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  runtime:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24.15.0, 24.22.1]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Check essential package guarantees
        run: pnpm build && pnpm test:unit --tagsFilter='!full' && pnpm test:integration --tagsFilter='!full' && pnpm typecheck && pnpm lint && pnpm format:check
      - uses: actions/download-artifact@v8
        with:
          name: qualified-package
          path: .release/
      - run: pnpm exec node scripts/release/release.ts consumer

  website:
    name: Check website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # the website's integration and browser tests launch Chromium
      - run: pnpm --dir website exec playwright install --with-deps chromium
      - run: pnpm --dir website check
        env:
          JG_PLANS_PUBLISHED_VERSION: ${{ inputs.published_version }}
      - uses: actions/upload-artifact@v7
        with:
          name: qualified-site
          path: website/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: website/dist/
          retention-days: 30

  deploy:
    name: Deploy checked website
    needs: [package, runtime, website]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.package.result == 'success' && needs.runtime.result == 'success' && needs.website.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: qualified-site
          path: website/dist/
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
      - run: pnpm --dir website verify:deployment

  publish:
    name: Publish verified archive
    needs: [package, runtime, website]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TRUSTED_PUBLISHING_READY: ${{ vars.NPM_TRUSTED_PUBLISHING_READY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: qualified-package
          path: .release/
      - run: pnpm exec node scripts/release/release.ts publish
