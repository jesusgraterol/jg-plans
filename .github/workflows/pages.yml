name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      published_version:
        description: Verify this matching npm version before rendering release presentation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  website:
    name: Check website
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # the website's integration and browser tests launch Chromium
      - run: pnpm --dir website exec playwright install --with-deps chromium
      - run: pnpm --dir website check
        env:
          JG_PLANS_PUBLISHED_VERSION: ${{ inputs.published_version }}
      - uses: actions/upload-artifact@v7
        with:
          name: qualified-site
          path: website/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist/
          retention-days: 30

  deploy:
    name: Deploy checked website
    needs: website
    if: needs.website.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: qualified-site
          path: website/dist/
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
      - run: pnpm --dir website verify:deployment
