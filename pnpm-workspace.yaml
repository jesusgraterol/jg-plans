packages:
  - website

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Exact owned release; verify the qualified archive checksum before adoption.
  - jg-fs@1.7.0
  - jg-exception@1.7.1
  # Shared checker qualified against the current npm archive format.
  - jg-package-check@1.0.0
  - jg-fs@1.8.0
  - jg-process@1.8.0
  # Approved pinned website baseline, published 2026-10-21.
  - astro@7.4.2
  # The Markdown processor required by the pinned Astro baseline.
  - '@astrojs/markdown-satteri@0.4.5'
  # Required by the pinned Astro Markdown dependency graph.
  - '@astrojs/prism@4.1.1'
  # Required by the pinned Astro baseline.
  - '@astrojs/telemetry@3.4.1'
strictDepBuilds: true
allowBuilds: {}
